name: Installer

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write         # für das Release nach einem Merge in main
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Version lesen
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path vocaloid_generator/version.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: uv in den Installer legen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/uv | Out-Null
          $uv = (Get-Command uv).Source
          foreach ($name in "uv.exe", "uvx.exe", "uvw.exe") {
            $file = Join-Path (Split-Path $uv) $name
            if (Test-Path $file) { Copy-Item $file installer/uv/ }
          }
          Get-ChildItem installer/uv
      # Die Setup.exe bringt ihr eigenes Python mit, damit uv auf dem PC nichts in AppData\Roaming\uv\python anlegen
      # oder lesen muss (dort sperrt Windows manchmal die Verknüpfungen von uv, os error 448). Genommen wird der echte
      # Ordner cpython-3.12.<patch>-…, nicht die Verknüpfung cpython-3.12-…, die uv daneben anlegt.
      - name: Python in den Installer legen
        shell: pwsh
        run: |
          $dl = Join-Path $env:RUNNER_TEMP "python-dl"
          uv python install 3.12 --install-dir $dl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = Get-ChildItem $dl -Directory | Where-Object { $_.Name -match '^cpython-3\.12\.\d+-windows-x86_64-none$' } | Select-Object -First 1
          if (-not $dir) { Write-Error "Python 3.12 fehlt in $dl"; exit 1 }
          Copy-Item $dir.FullName installer/python -Recurse
          & installer/python/python.exe -c "import sys, ssl, sqlite3; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Setup.exe bauen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" installer/VloidSongs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Wie auf Strikers PC: In AppData\Roaming\uv\python liegt ein Python, das uv nicht abfragen kann. Ohne eigenes
      # Python bricht uv dann mit „Failed to inspect Python interpreter from managed installations“ ab.
      - name: Kaputtes Python in AppData anlegen
        shell: pwsh
        run: |
          $broken = Join-Path $env:APPDATA "uv\python\cpython-3.13.0-windows-x86_64-none"
          New-Item -ItemType Directory -Force $broken | Out-Null
          Copy-Item "$env:SystemRoot\System32\where.exe" (Join-Path $broken "python.exe")
          $out = uv python find --managed-python 2>&1 | Out-String
          $out
          if ($out -notmatch "Failed to (inspect|query) Python interpreter") {
            Write-Error "uv stolpert nicht über das kaputte Python, der Test prüft so nichts"; exit 1
          }
          exit 0
      - name: Setup.exe testen (still installieren, Dateien prüfen, deinstallieren)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/Output/*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "VloidSongs"
          # Wie bei Striker nach 1.2.0: Die automatische Bewertung ist eingerichtet, aber ihr fehlt requests. Das Setup
          # ergänzt sie (setup_bewertung.py --ergaenzen); hier ist sie leer, also lädt es alle ihre Pakete.
          $bewertung = Join-Path $target "tools\bewertung\venv"
          $mitgebracht = (Resolve-Path installer/python/python.exe).Path
          uv venv $bewertung --python $mitgebracht
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target", "/TASKS=" -Wait
          foreach ($file in "vocaloid_generator\app.py", "uv\uv.exe", "python\python.exe", "Vloid Songs starten.bat", ".venv\Scripts\python.exe") {
            if (-not (Test-Path (Join-Path $target $file))) { Write-Error "$file fehlt nach dem Installieren"; exit 1 }
          }
          $cfg = Get-Content (Join-Path $target ".venv\pyvenv.cfg") -Raw
          $cfg
          if ($cfg -notmatch [regex]::Escape((Join-Path $target "python"))) { Write-Error "Die Umgebung nimmt nicht das mitgebrachte Python"; exit 1 }
          & (Join-Path $target ".venv\Scripts\python.exe") -c "import nicegui, pedalboard, pretty_midi; print('Bibliotheken da')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # So legen die setup_….py-Skripte die Umgebungen der Modelle an (Demucs, Bewertung, KI-Begleitung)
          $python = & (Join-Path $target ".venv\Scripts\python.exe") -c "import sys; sys.path.insert(0, r'$target\vocaloid_generator'); import config; print(config.venv_python())"
          if ($python -ne (Join-Path $target "python\python.exe")) { Write-Error "Modelle bekämen $python statt des mitgebrachten Pythons"; exit 1 }
          & (Join-Path $target "uv\uv.exe") venv (Join-Path $env:RUNNER_TEMP "modell-venv") --python $python
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & (Join-Path $bewertung "Scripts\python.exe") -c "import requests, audiobox_aesthetics.infer; print('Bewertung ergaenzt')"
          if ($LASTEXITCODE -ne 0) { Write-Error "Das Setup hat der Bewertung requests nicht nachgeladen"; exit 1 }
          Start-Process (Join-Path $target "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: VloidSongs-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/*.exe
      # Nach einem Merge in main: gibt es zur Version in version.py noch kein Release, entsteht es hier, mit der
      # Setup.exe und dem Abschnitt aus CHANGELOG.md. Danach findet „Nach Update suchen“ in der App die neue Version.
      - name: Release veröffentlichen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { "Release v$v gibt es schon"; exit 0 }
          $parts = [regex]::Split((Get-Content CHANGELOG.md -Raw -Encoding utf8), '(?m)^## ')
          $section = $parts | Where-Object { $_ -match "^$([regex]::Escape($v))\b" } | Select-Object -First 1
          $notes = if ($section) { $section.Substring($section.IndexOf("`n") + 1).Trim() } else { "Vloid Songs $v" }
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8
          $setup = (Get-ChildItem installer/Output/*.exe | Select-Object -First 1).FullName
          gh release create "v$v" $setup --title "Vloid Songs $v" --notes-file release_notes.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
