name: Installer

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write         # für das Release nach einem Merge in main
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Version lesen
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path vocaloid_generator/version.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: uv in den Installer legen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/uv | Out-Null
          $uv = (Get-Command uv).Source
          foreach ($name in "uv.exe", "uvx.exe", "uvw.exe") {
            $file = Join-Path (Split-Path $uv) $name
            if (Test-Path $file) { Copy-Item $file installer/uv/ }
          }
          Get-ChildItem installer/uv
      - name: Setup.exe bauen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" installer/VloidSongs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Setup.exe testen (still installieren, Dateien prüfen, deinstallieren)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/Output/*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "VloidSongs"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target", "/TASKS=" -Wait
          foreach ($file in "vocaloid_generator\app.py", "uv\uv.exe", "Vloid Songs starten.bat", ".venv\Scripts\python.exe") {
            if (-not (Test-Path (Join-Path $target $file))) { Write-Error "$file fehlt nach dem Installieren"; exit 1 }
          }
          & (Join-Path $target ".venv\Scripts\python.exe") -c "import nicegui, pedalboard, pretty_midi; print('Bibliotheken da')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process (Join-Path $target "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: VloidSongs-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/*.exe
      # Nach einem Merge in main: gibt es zur Version in version.py noch kein Release, entsteht es hier, mit der
      # Setup.exe und dem Abschnitt aus CHANGELOG.md. Danach findet „Nach Update suchen“ in der App die neue Version.
      - name: Release veröffentlichen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { "Release v$v gibt es schon"; exit 0 }
          $parts = [regex]::Split((Get-Content CHANGELOG.md -Raw -Encoding utf8), '(?m)^## ')
          $section = $parts | Where-Object { $_ -match "^$([regex]::Escape($v))\b" } | Select-Object -First 1
          $notes = if ($section) { $section.Substring($section.IndexOf("`n") + 1).Trim() } else { "Vloid Songs $v" }
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8
          $setup = (Get-ChildItem installer/Output/*.exe | Select-Object -First 1).FullName
          gh release create "v$v" $setup --title "Vloid Songs $v" --notes-file release_notes.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
