name: Tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: uv sync --locked
      - name: FluidSynth laden
        run: uv run setup_fluidsynth.py
      - name: Ruff
        run: uv run ruff check .
      - name: Musikalische Regressionen
        run: >-
          uv run pytest -q --maxfail=1
          vocaloid_generator/tests/test_musical_coherence.py
          vocaloid_generator/tests/test_quality_review.py
          vocaloid_generator/tests/test_app_160.py::test_simple_view_can_choose_and_keep_a_hook
          vocaloid_generator/tests/test_schalter.py::test_every_switch_has_a_proof
          vocaloid_generator/tests/test_schalter.py::test_tests_named_as_proof_exist_and_use_the_switch
          vocaloid_generator/tests/test_gesang_130.py::test_off_pitch_notes_are_pulled_in_and_vibrato_and_glides_stay
          vocaloid_generator/tests/test_stil_effekte.py::test_the_pipeline_applies_the_effects_of_the_style
          vocaloid_generator/tests/test_video_150.py::test_each_part_of_the_video_has_its_switch
          vocaloid_generator/tests/test_voice.py::test_without_neutrino_voicevox_sings_lead_harmony_and_choir
      - name: Tests
        run: uv run pytest -rs --maxfail=5

